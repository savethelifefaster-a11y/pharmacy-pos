<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>PharmaPOS PRO V3</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
    
    <style>
        body { background-color: #f3f4f6; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .app-container { min-height: 100vh; display: flex; flex-direction: column; }
        .main-content { flex: 1; padding-bottom: 80px; overflow-y: auto; }
        .hidden-section { display: none !important; }
        /* Custom Tab Styles */
        .tab-active { border-bottom: 2px solid #059669; color: #059669; font-weight: bold; }
        .tab-inactive { color: #6b7280; font-weight: normal; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="bg-green-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">PharmaPOS Pro</h1>
            <span class="text-xs bg-green-800 px-2 py-1 rounded">Offline Ready</span>
        </header>

        <main class="main-content p-4" id="main-container">
            
            <section id="module-dashboard" class="module-section block">
                <h2 class="text-lg font-bold text-gray-700 mb-4">Today's Overview</h2>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                        <p class="text-xs text-gray-500 font-semibold uppercase">Sales</p>
                        <p class="text-xl font-bold text-gray-800" id="dash-sales">₹0.00</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                        <p class="text-xs text-gray-500 font-semibold uppercase">Profit</p>
                        <p class="text-xl font-bold text-gray-800" id="dash-profit">₹0.00</p>
                    </div>
                </div>
            </section>

            <section id="module-pos" class="module-section hidden-section">
                <h2 class="text-lg font-bold text-gray-700 mb-4">New Invoice</h2>
                
                <div class="bg-white p-4 rounded-xl shadow mb-4">
                    <div class="relative mb-2">
                        <input type="text" id="pos-search" placeholder="Search by Name or Barcode..." class="w-full p-2 pl-8 border rounded bg-gray-50 focus:outline-none focus:border-blue-500">
                        <i data-feather="search" class="w-4 h-4 absolute left-2 top-3 text-gray-400"></i>
                    </div>
                    <div id="pos-search-results" class="space-y-1 max-h-40 overflow-y-auto"></div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow mb-4 min-h-[150px]">
                    <h3 class="font-bold text-gray-800 mb-2 border-b pb-1">Current Cart</h3>
                    <div id="pos-cart-list" class="space-y-3 mb-4">
                        <p class="text-xs text-gray-400 text-center py-4">Cart is empty</p>
                    </div>
                    
                    <div class="border-t pt-3 flex justify-between font-bold text-xl text-gray-800">
                        <span>Total:</span>
                        <span id="pos-total">₹0.00</span>
                    </div>
                </div>

                <button id="btn-checkout" disabled class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow hover:bg-blue-700 disabled:opacity-50 mb-4">
                    Complete Checkout
                </button>
            </section>

            <section id="module-inventory" class="module-section hidden-section">
                <h2 class="text-lg font-bold text-gray-700 mb-4">Inventory Management</h2>
                
                <div class="bg-white rounded-xl shadow mb-4 overflow-hidden">
                    <h3 class="font-bold text-gray-800 p-4 bg-gray-50 border-b flex items-center">
                        <i data-feather="plus-circle" class="w-4 h-4 mr-2 text-green-600"></i> Add New Item
                    </h3>
                    
                    <div class="flex border-b text-sm">
                        <button class="w-1/3 py-3 tab-active inv-tab-btn" data-tab="tab-basic">Basic</button>
                        <button class="w-1/3 py-3 tab-inactive inv-tab-btn" data-tab="tab-pricing">Pricing</button>
                        <button class="w-1/3 py-3 tab-inactive inv-tab-btn" data-tab="tab-stock">Stock</button>
                    </div>

                    <form id="form-add-medicine" class="p-4">
                        
                        <div id="tab-basic" class="inv-tab-content block space-y-4">
                            <div>
                                <label class="text-xs text-gray-500 font-semibold">Item Name *</label>
                                <input type="text" id="inv-name" required class="w-full p-2 border rounded bg-gray-50" placeholder="e.g. Aceden Sp">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">Barcode / Code</label>
                                    <input type="text" id="inv-code" class="w-full p-2 border rounded bg-gray-50" placeholder="Scan or type">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">Category</label>
                                    <input type="text" id="inv-category" class="w-full p-2 border rounded bg-gray-50" placeholder="e.g. Painkiller">
                                </div>
                            </div>
                            <div class="p-3 bg-blue-50 border border-blue-100 rounded">
                                <label class="text-xs text-blue-700 font-bold mb-2 block">Unit & Conversion</label>
                                <div class="grid grid-cols-2 gap-3 mb-2">
                                    <div>
                                        <label class="text-[10px] text-gray-500 uppercase">Primary Unit</label>
                                        <select id="inv-unit-pri" class="w-full p-2 border rounded text-sm bg-white">
                                            <option value="Strips">Strips</option>
                                            <option value="Boxes">Boxes</option>
                                            <option value="Bottles">Bottles</option>
                                            <option value="Pieces">Pieces</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-gray-500 uppercase">Secondary Unit</label>
                                        <select id="inv-unit-sec" class="w-full p-2 border rounded text-sm bg-white">
                                            <option value="Tablets">Tablets</option>
                                            <option value="Pieces">Pieces</option>
                                            <option value="None">None</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="flex items-center text-sm text-gray-600">
                                    <span>1 Primary = </span>
                                    <input type="number" id="inv-conversion" value="10" class="w-16 p-1 border rounded mx-2 text-center bg-white">
                                    <span>Secondary</span>
                                </div>
                            </div>
                        </div>

                        <div id="tab-pricing" class="inv-tab-content hidden space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">Purchase Price (₹)</label>
                                    <input type="number" step="0.01" id="inv-purchase" required class="w-full p-2 border rounded bg-gray-50" placeholder="Your cost">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">MRP (₹)</label>
                                    <input type="number" step="0.01" id="inv-mrp" required class="w-full p-2 border rounded bg-gray-50" placeholder="Max price">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">Sale Price (₹)</label>
                                    <input type="number" step="0.01" id="inv-sale" required class="w-full p-2 border rounded bg-gray-50" placeholder="Selling for">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">Tax Rate (%)</label>
                                    <select id="inv-tax" class="w-full p-2 border rounded bg-gray-50">
                                        <option value="0">None (0%)</option>
                                        <option value="5">GST 5%</option>
                                        <option value="12">GST 12%</option>
                                        <option value="18">GST 18%</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-gray-500 font-semibold">HSN / SAC Code</label>
                                <input type="text" id="inv-hsn" class="w-full p-2 border rounded bg-gray-50">
                            </div>
                        </div>

                        <div id="tab-stock" class="inv-tab-content hidden space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">Opening Stock Qty</label>
                                    <input type="number" id="inv-qty" required class="w-full p-2 border rounded bg-gray-50" placeholder="In Primary Unit">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">Min Stock Alert</label>
                                    <input type="number" id="inv-min-stock" value="5" class="w-full p-2 border rounded bg-gray-50">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">Batch No</label>
                                    <input type="text" id="inv-batch" class="w-full p-2 border rounded bg-gray-50">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-500 font-semibold">Expiry Date</label>
                                    <input type="month" id="inv-expiry" class="w-full p-2 border rounded bg-gray-50">
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-gray-500 font-semibold">Item Location (Rack/Shelf)</label>
                                <input type="text" id="inv-location" class="w-full p-2 border rounded bg-gray-50" placeholder="e.g. Rack A2">
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded shadow hover:bg-green-700 mt-6 active:scale-95 transition-transform">
                            Save Item Details
                        </button>
                    </form>
                </div>

                <div class="bg-white p-4 rounded-xl shadow">
                    <h3 class="font-bold text-gray-800 mb-3">Current Stock</h3>
                    <div class="relative mb-3">
                        <input type="text" id="inv-search" placeholder="Search medicine or scan barcode..." class="w-full p-2 pl-8 border rounded bg-gray-50">
                        <i data-feather="search" class="w-4 h-4 absolute left-2 top-3 text-gray-400"></i>
                    </div>
                    <div id="inv-list" class="space-y-2"></div>
                </div>
            </section>

            <section id="module-settings" class="module-section hidden-section">
                <h2 class="text-lg font-bold text-gray-700 mb-4">System Settings</h2>
                <div class="bg-white p-4 rounded-xl shadow text-center">
                    <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow" onclick="alert('Export ready for Phase 4!')">
                        Export Database Backup
                    </button>
                </div>
            </section>

        </main>

        <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full z-50 flex justify-around items-center pb-safe shadow-lg">
            <button class="nav-btn flex flex-col items-center p-3 text-green-600 w-1/4" data-target="dashboard">
                <i data-feather="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-semibold">Home</span>
            </button>
            <button class="nav-btn flex flex-col items-center p-3 text-gray-400 w-1/4" data-target="pos">
                <i data-feather="shopping-cart" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-semibold">Billing</span>
            </button>
            <button class="nav-btn flex flex-col items-center p-3 text-gray-400 w-1/4" data-target="inventory">
                <i data-feather="package" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-semibold">Stock</span>
            </button>
            <button class="nav-btn flex flex-col items-center p-3 text-gray-400 w-1/4" data-target="settings">
                <i data-feather="settings" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-semibold">More</span>
            </button>
        </nav>
    </div>

    <script>
        // Database
        localforage.config({ name: 'PharmaPOS_DB', storeName: 'pharmacy_data' });
        const DB = {
            init: async () => {
                if (!await localforage.getItem('inventory')) await localforage.setItem('inventory', []);
                if (!await localforage.getItem('sales')) await localforage.setItem('sales', []);
            },
            getTable: async (t) => (await localforage.getItem(t)) || [],
            saveTable: async (t, d) => await localforage.setItem(t, d)
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await DB.init(); setupNavigation(); refreshDashboard(); loadInventory(); feather.replace();
        });

        // Navigation
        function setupNavigation() {
            const btns = document.querySelectorAll('.nav-btn');
            const mods = document.querySelectorAll('.module-section');
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    mods.forEach(m => m.classList.add('hidden-section'));
                    document.getElementById(`module-${btn.dataset.target}`).classList.remove('hidden-section');
                    btns.forEach(b => { b.classList.remove('text-green-600'); b.classList.add('text-gray-400'); });
                    btn.classList.remove('text-gray-400'); btn.classList.add('text-green-600');
                });
            });
        }

        // Add Item Form Tab Logic
        const tabBtns = document.querySelectorAll('.inv-tab-btn');
        const tabContents = document.querySelectorAll('.inv-tab-content');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                tabBtns.forEach(b => { b.classList.remove('tab-active'); b.classList.add('tab-inactive'); });
                tabContents.forEach(c => c.classList.add('hidden'));
                btn.classList.remove('tab-inactive'); btn.classList.add('tab-active');
                document.getElementById(btn.dataset.tab).classList.remove('hidden');
            });
        });

        async function refreshDashboard() {
            const sales = await DB.getTable('sales');
            let tSales = 0, tProfit = 0;
            const today = new Date().toISOString().split('T')[0];
            sales.forEach(s => {
                if(s.date === today) { tSales += parseFloat(s.totalAmount); tProfit += parseFloat(s.totalProfit); }
            });
            document.getElementById('dash-sales').innerText = `₹${tSales.toFixed(2)}`;
            document.getElementById('dash-profit').innerText = `₹${tProfit.toFixed(2)}`;
        }

        // POS
        let cart = [];
        document.getElementById('pos-search').addEventListener('input', async (e) => {
            const q = e.target.value.toLowerCase();
            const res = document.getElementById('pos-search-results');
            res.innerHTML = '';
            if(q.length < 1) return;
            const inv = await DB.getTable('inventory');
            // Search by Name or Barcode
            const filtered = inv.filter(i => (i.name.toLowerCase().includes(q) || (i.code && i.code.toLowerCase().includes(q))) && parseInt(i.qty) > 0);
            filtered.forEach(i => {
                res.innerHTML += `
                    <div class="p-2 border flex justify-between items-center bg-gray-50 mt-1 rounded">
                        <div>
                            <p class="font-bold text-sm text-gray-800">${i.name}</p>
                            <p class="text-xs text-gray-500">₹${i.salePrice} / ${i.unitPri} | Stock: ${i.qty}</p>
                        </div>
                        <button class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold" onclick="addToCart('${i.id}')">Add</button>
                    </div>`;
            });
        });

        window.addToCart = async (id) => {
            const inv = await DB.getTable('inventory');
            const item = inv.find(i => i.id === id);
            if(!item) return;
            const ext = cart.find(i => i.id === id);
            if(ext) {
                if(ext.cartQty < parseInt(item.qty)) ext.cartQty++;
                else alert('Not enough stock available!');
            } else cart.push({...item, cartQty: 1});
            document.getElementById('pos-search').value = '';
            document.getElementById('pos-search-results').innerHTML = '';
            renderCart();
        };

        window.updateCartQty = (idx, change) => {
            const item = cart[idx];
            const newQty = item.cartQty + change;
            if (newQty > 0 && newQty <= parseInt(item.qty)) { item.cartQty = newQty; renderCart(); }
            else if (newQty > parseInt(item.qty)) alert(`Only ${item.qty} in stock!`);
            else if (newQty === 0) removeFromCart(idx);
        };

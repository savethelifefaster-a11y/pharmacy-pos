<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>PharmaPOS Master</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
    
    <style>
        body { background-color: #f3f4f6; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .app-container { min-height: 100vh; display: flex; flex-direction: column; }
        .main-content { flex: 1; padding-bottom: 80px; overflow-y: auto; }
        .hidden-section { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="bg-green-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">PharmaPOS</h1>
            <span class="text-xs bg-green-800 px-2 py-1 rounded">Offline Ready</span>
        </header>

        <main class="main-content p-4" id="main-container">
            
            <section id="module-dashboard" class="module-section block">
                <h2 class="text-lg font-bold text-gray-700 mb-4">Today's Overview</h2>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                        <p class="text-xs text-gray-500 font-semibold uppercase">Sales</p>
                        <p class="text-xl font-bold text-gray-800" id="dash-sales">₹0.00</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                        <p class="text-xs text-gray-500 font-semibold uppercase">Profit</p>
                        <p class="text-xl font-bold text-gray-800" id="dash-profit">₹0.00</p>
                    </div>
                </div>
            </section>

            <section id="module-pos" class="module-section hidden-section">
                <h2 class="text-lg font-bold text-gray-700 mb-4">New Invoice</h2>
                
                <div class="bg-white p-4 rounded-xl shadow mb-4">
                    <div class="relative mb-2">
                        <input type="text" id="pos-search" placeholder="Search medicine to bill..." class="w-full p-2 pl-8 border rounded bg-gray-50 focus:outline-none focus:border-blue-500">
                        <i data-feather="search" class="w-4 h-4 absolute left-2 top-3 text-gray-400"></i>
                    </div>
                    <div id="pos-search-results" class="space-y-1 max-h-40 overflow-y-auto"></div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow mb-4 min-h-[150px]">
                    <h3 class="font-bold text-gray-800 mb-2 border-b pb-1">Current Cart</h3>
                    <div id="pos-cart-list" class="space-y-3 mb-4">
                        <p class="text-xs text-gray-400 text-center py-4">Cart is empty</p>
                    </div>
                    
                    <div class="border-t pt-3 flex justify-between font-bold text-xl text-gray-800">
                        <span>Total:</span>
                        <span id="pos-total">₹0.00</span>
                    </div>
                </div>

                <button id="btn-checkout" disabled class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow hover:bg-blue-700 disabled:opacity-50 mb-4">
                    Complete Checkout
                </button>
            </section>

            <section id="module-inventory" class="module-section hidden-section">
                <h2 class="text-lg font-bold text-gray-700 mb-4">Inventory Management</h2>
                
                <div class="bg-white p-4 rounded-xl shadow mb-4">
                    <h3 class="font-bold text-gray-800 mb-3 flex items-center"><i data-feather="plus-circle" class="w-4 h-4 mr-1 text-green-600"></i> Add New Medicine</h3>
                    <form id="form-add-medicine" class="space-y-3">
                        <div>
                            <label class="text-xs text-gray-500 font-semibold">Medicine Name</label>
                            <input type="text" id="inv-name" required class="w-full p-2 border rounded bg-gray-50">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs text-gray-500 font-semibold">Batch No</label>
                                <input type="text" id="inv-batch" required class="w-full p-2 border rounded bg-gray-50">
                            </div>
                            <div>
                                <label class="text-xs text-gray-500 font-semibold">Expiry Date</label>
                                <input type="month" id="inv-expiry" required class="w-full p-2 border rounded bg-gray-50">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs text-gray-500 font-semibold">MRP (₹)</label>
                                <input type="number" step="0.01" id="inv-mrp" required class="w-full p-2 border rounded bg-gray-50">
                            </div>
                            <div>
                                <label class="text-xs text-gray-500 font-semibold">Stock Qty</label>
                                <input type="number" id="inv-qty" required class="w-full p-2 border rounded bg-gray-50">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded shadow hover:bg-green-700 mt-2">
                            Save Medicine
                        </button>
                    </form>
                </div>

                <div class="bg-white p-4 rounded-xl shadow">
                    <h3 class="font-bold text-gray-800 mb-3">Current Stock</h3>
                    <div class="relative mb-3">
                        <input type="text" id="inv-search" placeholder="Search medicine..." class="w-full p-2 pl-8 border rounded bg-gray-50">
                        <i data-feather="search" class="w-4 h-4 absolute left-2 top-3 text-gray-400"></i>
                    </div>
                    <div id="inv-list" class="space-y-2"></div>
                </div>
            </section>

            <section id="module-settings" class="module-section hidden-section">
                <h2 class="text-lg font-bold text-gray-700 mb-4">System Settings</h2>
                <div class="bg-white p-4 rounded-xl shadow">Export JSON Logic (Phase 4)</div>
            </section>

        </main>

        <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full z-50 flex justify-around items-center pb-safe shadow-lg">
            <button class="nav-btn flex flex-col items-center p-3 text-green-600 w-1/4" data-target="dashboard">
                <i data-feather="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-semibold">Home</span>
            </button>
            <button class="nav-btn flex flex-col items-center p-3 text-gray-400 w-1/4" data-target="pos">
                <i data-feather="shopping-cart" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-semibold">Billing</span>
            </button>
            <button class="nav-btn flex flex-col items-center p-3 text-gray-400 w-1/4" data-target="inventory">
                <i data-feather="package" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-semibold">Stock</span>
            </button>
            <button class="nav-btn flex flex-col items-center p-3 text-gray-400 w-1/4" data-target="settings">
                <i data-feather="settings" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-semibold">More</span>
            </button>
        </nav>
    </div>

    <script>
        // --- 1. DATABASE LOGIC ---
        localforage.config({ name: 'PharmaPOS_DB', storeName: 'pharmacy_data' });
        const DB = {
            init: async () => {
                const inv = await localforage.getItem('inventory');
                if (!inv) await localforage.setItem('inventory', []);
                const sales = await localforage.getItem('sales');
                if (!sales) await localforage.setItem('sales', []);
            },
            getTable: async (t) => (await localforage.getItem(t)) || [],
            saveTable: async (t, d) => await localforage.setItem(t, d)
        };

        // --- 2. APP LOGIC ---
        document.addEventListener('DOMContentLoaded', async () => {
            await DB.init();
            setupNavigation();
            refreshDashboard();
            loadInventory();
            feather.replace();
        });

        function setupNavigation() {
            const btns = document.querySelectorAll('.nav-btn');
            const mods = document.querySelectorAll('.module-section');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    mods.forEach(m => m.classList.add('hidden-section'));
                    document.getElementById(`module-${btn.dataset.target}`).classList.remove('hidden-section');
                    btns.forEach(b => { b.classList.remove('text-green-600'); b.classList.add('text-gray-400'); });
                    btn.classList.remove('text-gray-400'); btn.classList.add('text-green-600');
                });
            });
        }

        async function refreshDashboard() {
            const sales = await DB.getTable('sales');
            let tSales = 0, tProfit = 0;
            const today = new Date().toISOString().split('T')[0];
            sales.forEach(s => {
                if(s.date === today) { tSales += parseFloat(s.totalAmount); tProfit += parseFloat(s.totalProfit); }
            });
            document.getElementById('dash-sales').innerText = `₹${tSales.toFixed(2)}`;
            document.getElementById('dash-profit').innerText = `₹${tProfit.toFixed(2)}`;
        }

        // --- POS LOGIC ---
        let cart = [];
        document.getElementById('pos-search').addEventListener('input', async (e) => {
            const q = e.target.value.toLowerCase();
            const res = document.getElementById('pos-search-results');
            res.innerHTML = '';
            if(q.length < 1) return;
            const inv = await DB.getTable('inventory');
            const filtered = inv.filter(i => i.name.toLowerCase().includes(q) && parseInt(i.qty) > 0);
            filtered.forEach(i => {
                res.innerHTML += `
                    <div class="p-2 border flex justify-between items-center bg-gray-50 mt-1 rounded">
                        <div><p class="font-bold text-sm text-gray-800">${i.name}</p><p class="text-xs text-gray-500">₹${i.mrp} | Stock: ${i.qty}</p></div>
                        <button class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold" onclick="addToCart('${i.id}')">Add</button>
                    </div>`;
            });
        });

        window.addToCart = async (id) => {
            const inv = await DB.getTable('inventory');
            const item = inv.find(i => i.id === id);
            if(!item) return;
            const ext = cart.find(i => i.id === id);
            if(ext) {
                if(ext.cartQty < parseInt(item.qty)) ext.cartQty++;
                else alert('Not enough stock available!');
            } else cart.push({...item, cartQty: 1});
            document.getElementById('pos-search').value = '';
            document.getElementById('pos-search-results').innerHTML = '';
            renderCart();
        };

        function renderCart() {
            const list = document.getElementById('pos-cart-list');
            const btn = document.getElementById('btn-checkout');
            list.innerHTML = '';
            let total = 0;
            if(cart.length === 0) {
                list.innerHTML = '<p class="text-center py-4 text-xs text-gray-400">Cart is empty</p>';
                document.getElementById('pos-total').innerText = '₹0.00';
                btn.disabled = true;
                return;
            }
            cart.forEach((i, idx) => {
                const t = parseFloat(i.mrp) * i.cartQty;
                total += t;
                list.innerHTML += `
                    <div class="flex justify-between border-b pb-2 mb-2 items-center text-sm">
                        <div class="w-1/2"><p class="font-bold text-gray-800 truncate">${i.name}</p><p class="text-xs text-gray-500">₹${i.mrp} x ${i.cartQty}</p></div>
                        <div class="font-bold text-gray-800">₹${t.toFixed(2)}</div>
                        <button onclick="removeFromCart(${idx})" class="text-red-500 font-bold px-2 text-lg">×</button>
                    </div>`;
            });
            document.getElementById('pos-total').innerText = `₹${total.toFixed(2)}`;
            btn.disabled = false;
        }

        window.removeFromCart = (idx) => { cart.splice(idx, 1); renderCart(); };

        document.getElementById('btn-checkout').addEventListener('click', async () => {
            let total = 0, profit = 0;
            const inv = await DB.getTable('inventory');
            cart.forEach(c => {
                const dbItem = inv.find(i => i.id === c.id);
                if(dbItem) dbItem.qty = (parseInt(dbItem.qty) - c.cartQty).toString();
                const t = parseFloat(c.mrp) * c.cartQty;
                total += t; profit += t * 0.15;
            });
            await DB.saveTable('inventory', inv);
            const sales = await DB.getTable('sales');
            sales.push({ id: Date.now().toString(), date: new Date().toISOString().split('T')[0], totalAmount: total.toFixed(2), totalProfit: profit.toFixed(2) });
            await DB.saveTable('sales', sales);
            cart = []; renderCart(); loadInventory(); refreshDashboard();
            alert('✅ Invoice Saved & Stock Updated!');
            document.querySelector('[data-target="dashboard"]').click();
        });

        // --- INVENTORY LOGIC ---
        document.getElementById('form-add-medicine').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inv = await DB.getTable('inventory');
            inv.push({
                id: Date.now().toString(), name: document.getElementById('inv-name').value,
                batch: document.getElementById('inv-batch').value, expiry: document.getElementById('inv-expiry').value,
                mrp: document.getElementById('inv-mrp').value, qty: document.getElementById('inv-qty').value
            });
            await DB.saveTable('inventory', inv);
            e.target.reset(); loadInventory(); alert('✅ Medicine Added!');
        });

        async function loadInventory(q = '') {
            const inv = await DB.getTable('inventory');
            const list = document.getElementById('inv-list');
            list.innerHTML = '';
            const f = inv.filter(i => i.name.toLowerCase().includes(q.toLowerCase()));
            if(f.length===0) { list.innerHTML = '<p class="text-center py-4 text-xs text-gray-400">No medicines found.</p>'; return; }
            f.forEach(i => {
                const low = parseInt(i.qty) < 10;
                list.innerHTML += `
                    <div class="border p-3 rounded mb-2 flex justify-between bg-white ${low?'border-red-300 bg-red-50':''}">
                        <div class="w-3/4"><p class="font-bold text-gray-800 truncate">${i.name}</p><p class="text-xs text-gray-500 mt-1">Batch: ${i.batch} | Exp: ${i.expiry}</p><p class="text-sm font-semibold mt-1">MRP: ₹${i.mrp}</p></div>
                        <div class="w-1/4 text-right flex flex-col items-end"><span class="px-2 py-1 bg-gray-100 rounded text-xs ${low?'text-red-600':'text-green-600'} font-bold">${i.qty} units</span>
                        <button onclick="deleteMedicine('${i.id}')" class="text-red-500 text-xs mt-2 font-bold">Remove</button></div>
                    </div>`;
            });
        }
        
        document.getElementById('inv-search').addEventListener('input', (e) => loadInventory(e.target.value));
        
        window.deleteMedicine = async (id) => {
            if(confirm('Delete this medicine?')) {
                let inv = await DB.getTable('inventory');
                await DB.saveTable('inventory', inv.filter(i => i.id !== id));
                loadInventory();
            }
        };
    </script>
</body>
</html>
